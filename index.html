<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e9e9e9">
<title>Your Links</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#151515}
  body{background:#e8e8e8;padding:18px 12px 38px}
  .page{position:relative;max-width:560px;margin:0 auto;min-height:94vh;overflow:hidden;border-radius:34px;background:linear-gradient(#e9e9e9,#f0f0f0 65%,#e7e7e7);box-shadow:0 12px 35px #00000012}
  .hero{height: min(112vw,660px);min-height:430px;max-height:660px;position:relative;overflow:hidden;background:#d8d5cf}
  .hero img{width:100%;height:100%;object-fit:cover;object-position:center 28%;display:block}
  .hero:after{content:"";position:absolute;inset:42% 0 0;background:linear-gradient(to bottom,transparent,rgba(232,232,232,.52) 48%,#e9e9e9 100%);pointer-events:none}
  .photo-prompt{position:absolute;z-index:2;top:16px;left:16px;border:0;border-radius:22px;padding:10px 14px;background:#ffffffdf;font-size:13px;font-weight:650;cursor:pointer;box-shadow:0 3px 12px #00000012}
  .identity{position:relative;z-index:3;margin-top:-68px;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px 28px;color:white;text-shadow:0 3px 9px #0008}
  .name{font-size:clamp(34px,8vw,54px);font-weight:800;letter-spacing:-1.5px;line-height:1.1;overflow-wrap:anywhere}
  .check{width:31px;height:31px;border-radius:50%;background:#169be8;color:white;display:inline-flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;text-shadow:none;flex-shrink:0}
  .links{padding:0 28px 26px;display:grid;gap:18px}
  .link{min-height:112px;padding:22px 16px;display:flex;align-items:center;justify-content:center;text-align:center;background:#fff;border:1px solid #f5f5f5;border-radius:28px;box-shadow:0 3px 0 #00000008,0 17px 24px #00000012;color:#161616;text-decoration:none;font-size:clamp(21px,5vw,28px);font-weight:750;transition:transform .12s,box-shadow .12s}
  .link:active{transform:scale(.985);box-shadow:0 7px 14px #00000010}
  .footer{text-align:center;color:#a4a4a4;font-size:14px;padding:8px 20px 36px}
  .footer a{color:inherit;text-decoration:none}
  .helper{margin:18px auto 0;max-width:560px;text-align:center;color:#777;font-size:12px;line-height:1.5}
  @media(min-width:600px){body{padding-top:28px}.page{min-height:900px}.hero{height:600px}}
</style>
